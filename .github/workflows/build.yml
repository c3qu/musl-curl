name: Build & Push

on:
  schedule:
    - cron: '13 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get latest static-curl release
        id: latest
        run: |
          TAG=$(gh release view -R stunnel/static-curl --json tagName -q .tagName 2>/dev/null || \
                curl -sS https://api.github.com/repos/stunnel/static-curl/releases/latest | jq -r .tagName)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get current version from Dockerfile
        id: current
        run: |
          VER=$(grep -oP 'CURL_VERSION=\K[\d.]+' Dockerfile)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Check if build needed
        id: check
        run: |
          echo "latest=${{ steps.latest.outputs.tag }}"
          echo "current=${{ steps.current.outputs.version }}"

          if [ "${{ steps.latest.outputs.tag }}" = "" ]; then
            echo "Failed to fetch latest release"
            exit 1
          fi

          if [ "${{ steps.latest.outputs.tag }}" != "${{ steps.current.outputs.version }}" ]; then
            echo "New version: ${{ steps.latest.outputs.tag }}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already at latest version"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Dockerfile
        if: steps.check.outputs.build == 'true'
        run: |
          sed -i "s/CURL_VERSION=[0-9.]\+/CURL_VERSION=${{ steps.latest.outputs.tag }}/" Dockerfile
          git diff

      - name: Commit version bump
        if: steps.check.outputs.build == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Dockerfile
          git commit -m "bump static-curl to ${{ steps.latest.outputs.tag }}"
          git push

      - uses: docker/setup-qemu-action@v4
        if: steps.check.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.build == 'true'

      - uses: docker/login-action@v4
        if: steps.check.outputs.build == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: steps.check.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: CURL_VERSION=${{ steps.latest.outputs.tag }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/musl-curl:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/musl-curl:${{ steps.latest.outputs.tag }}

      - uses: peter-evans/dockerhub-description@v5
        if: steps.check.outputs.build == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/musl-curl
          readme-filepath: ./README.md
